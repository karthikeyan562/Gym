# ===================================================================
# Gym Management System - Spring Boot Application Configuration
# ===================================================================

server.port=8080
spring.application.name=gym-management-backend

# Active Profile: 'dev' uses local persistent file DB with MySQL compatibility
# Set to 'mysql' to connect to local MySQL server (port 3306)
spring.profiles.active=dev

# Common JPA / Hibernate Configuration
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Security / JWT
gym.jwt.secret=9a3f78b4c2e6d1a5802f4e91c3d7b6a824e5f019b7d8c6e2a1045f93b8d7a6e5
gym.jwt.expiration-ms=86400000

# File Upload / Images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
