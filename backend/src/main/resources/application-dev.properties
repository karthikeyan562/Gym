# ===================================================================
# Dev Profile: Persistent Embedded Database in MySQL Compatibility Mode
# Allows instant out-of-the-box running without requiring MySQL service running
# ===================================================================

spring.datasource.url=jdbc:h2:file:./data/gym_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 console for easy inspection at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
